// Phone <-> dongle protocol.
//
// Transport: the "bridge" GATT service. The phone writes to CMD, the dongle notifies on EVT.
// Both directions are byte streams of frames: [length: u16 little endian][protobuf payload].
// A frame may span several writes/notifications and one write may hold several frames.
//
// Flow control: the phone may only write as many CMD bytes (length prefix included) as the
// dongle has granted through Credits events. Credits with reset=true replace the phone's
// balance instead of adding to it; the dongle sends one when a session starts and after an abort.
//
// Abort: writing any byte to the CTRL characteristic stops typing and discards every CMD byte
// the dongle has not processed yet. The phone's balance is zero until the following reset;
// credit increments that arrive in between were sent before the abort and must be ignored.
// Requests waiting for an Ack when the phone aborts may never get one.
//
// Disconnect: everything the dongle accepted is still typed, unacknowledged. A new session
// starts with empty streams.

// Versioning: fields are only ever added. A dongle answers requests it doesn't know with
// RESULT_INVALID, and Hello.capabilities tells the phone what it can use before trying.
//
// oneof field numbers are grouped so families can grow independently:
//    1-9   core (session, credits, acks)
//   10-29  input to the host
//   30-49  system (config, device, firmware update)
//   50+    on-device apps

syntax = "proto3";

package bridge;

message Request {
    // Echoed in the Ack for this request. 0 means no Ack is wanted.
    uint32 id = 1;

    oneof msg {
        Text text = 10;
        KeyCombo key_combo = 11;
        Consumer consumer = 12;
        KeyboardReport keyboard_report = 13;
        Strokes strokes = 14;

        Ping ping = 30;
        GetConfig get_config = 31;
        SetConfig set_config = 32;
        GetDeviceInfo get_device_info = 33;
        GetLogs get_logs = 34;
        GetProfiles get_profiles = 35;
        SelectProfile select_profile = 36;
        ProfileSecret profile_secret = 37;
        ResetProfile reset_profile = 38;

        OtaBegin ota_begin = 40;
        OtaData ota_data = 41;
        OtaEnd ota_end = 42;
        OtaAbort ota_abort = 43;
    }
}

// Typed with the dongle's current layout. May be split anywhere, even inside a UTF-8 sequence.
message Text {
    string text = 1;
}

// Keystrokes already translated by the phone, typed with the dongle's timing.
// Packed 3-byte entries: [modifiers, keycode, flags]. Each is pressed, then released.
// flags bit 0: the key is affected by Caps Lock; the dongle inverts Shift while the host has
// Caps Lock on, since only the dongle sees that state.
message Strokes {
    bytes strokes = 1;
}

// Pressed together, then released.
message KeyCombo {
    uint32 modifiers = 1;   // HID modifier bits
    bytes keys = 2;         // up to 6 HID keyboard usages
}

// Pressed, then released.
message Consumer {
    uint32 usage = 1;       // HID consumer page usage
}

// Sent as is. The phone is responsible for releasing keys with a later empty report.
message KeyboardReport {
    uint32 modifiers = 1;
    bytes keys = 2;
}

message GetConfig {}

// Only the fields present are changed. Replied to with a Config event.
message SetConfig {
    Config config = 1;
}

message Ping {}

// Replied to with a DeviceInfo event.
message GetDeviceInfo {}

// The dongle keeps its most recent log output in RAM. Positions count the bytes logged since
// boot; replied to with a Logs event holding the next chunk from `since` on. To read everything,
// start at 0 and repeat with Logs.next until it equals Logs.end.
message GetLogs {
    uint32 since = 1;
}

// Security key profiles: Main and Phantom. Each has its own FIDO credentials and OpenPGP card,
// encrypted with a key held by the dongle. Phantom's key also depends on a 32-byte secret the
// phone generates and keeps: without it Phantom's contents are indistinguishable from random data.
// The dongle holds the secret in RAM only, so it is needed again after every power-up. While
// Phantom is active and its secret hasn't arrived, the OpenPGP card is out of the reader and FIDO
// requests fail (except what a security key reset needs).
//
// Replied to with a Profiles event.
message GetProfiles {}

// Replied to with a Profiles event. make_default also makes it the profile used after power-up.
message SelectProfile {
    Profile profile = 1;
    bool make_default = 2;
}

// Opens the phantom profile; in state PHANTOM_NEW, sets it up with this secret. The Ack is
// RESULT_OK once open, RESULT_FAILED if the secret doesn't open it (nothing is changed) and
// RESULT_INVALID if it isn't 32 bytes. There is no way to change the secret: reset the profile and
// set it up again.
message ProfileSecret {
    bytes secret = 1;
}

// Erases the profile's FIDO credentials and OpenPGP card; the phantom profile returns to
// PHANTOM_NEW. The user confirms on the dongle first, so the Ack can take as long as that:
// RESULT_ABORTED if declined or not confirmed in time.
message ResetProfile {
    Profile profile = 1;
}

// Firmware update: OtaBegin, then OtaData in order from offset 0, then OtaEnd. While an update
// is running, input requests fail with RESULT_FAILED. An update is abandoned if the session ends,
// on a CTRL abort, or with OtaAbort.
//
// OtaBegin erases the inactive app slot, so its Ack can take several seconds. After OtaEnd is
// acknowledged the dongle restarts into the new firmware, which falls back to the previous one
// if it fails to start.
message OtaBegin {
    uint32 size = 1;        // image size in bytes (the build's firmware.bin)
    bytes sha256 = 2;       // SHA-256 of the whole image, checked by OtaEnd
}

message OtaData {
    uint32 offset = 1;      // must equal the number of bytes sent so far
    bytes data = 2;
}

message OtaEnd {}

message OtaAbort {}

message Config {
    optional string layout = 1;
    optional uint32 key_press_ms = 2;
    optional uint32 key_release_ms = 3;
    repeated string available_layouts = 4;  // read only
}

message Event {
    oneof msg {
        Hello hello = 1;
        Credits credits = 2;
        Ack ack = 3;

        Status status = 10;

        Config config = 30;
        DeviceInfo device_info = 31;
        Logs logs = 32;
        Profiles profiles = 33;
    }
}

// First event of every session.
message Hello {
    uint32 protocol_version = 1;
    uint32 max_frame = 2;               // largest CMD frame payload the dongle accepts
    string firmware_version = 3;
    // Request families this firmware handles, e.g. "text", "strokes", "key_combo", "consumer",
    // "keyboard_report", "config", "ota", "device_info", "logs", "profiles".
    repeated string capabilities = 4;
}

message Credits {
    uint32 bytes = 1;
    bool reset = 2;
}

enum Result {
    RESULT_OK = 0;
    RESULT_INVALID = 1;     // malformed or unsupported request
    RESULT_FAILED = 2;      // valid request that could not be carried out
    RESULT_ABORTED = 3;
}

// Sent once the request has been handled. For input requests that means queued for typing.
message Ack {
    uint32 id = 1;
    Result result = 2;
}

message Status {
    bool typing = 1;
    bool usb_mounted = 2;
    string layout = 3;
}

// Every field may be absent: firmware fills in what it knows, and adds fields over time.
message DeviceInfo {
    optional string name = 1;           // Bluetooth device name
    optional string model = 2;          // board, e.g. "LilyGo T-Dongle-S3"
    optional string chip = 3;           // e.g. "ESP32-S3 rev 0.2"
    optional uint32 flash_size = 4;     // bytes
    optional uint32 uptime_s = 5;
    // Why the dongle last restarted: "power_on", "software" (including updates), "panic",
    // "watchdog", "brownout", "other".
    optional string reset_reason = 6;
    optional uint32 free_heap = 7;      // bytes
    optional uint32 min_free_heap = 8;  // lowest free heap since boot, bytes
    repeated App apps = 9;              // on-device apps, in launcher order
    optional SecurityKey security_key = 10;
    optional sint32 tx_power_dbm = 11;  // Bluetooth transmit power
    optional Security security = 12;
}

message App {
    string id = 1;      // stable, e.g. "jiggler"
    string name = 2;    // as shown on the dongle
}

message SecurityKey {
    string status = 1;  // "ok" while the FIDO2 security key runs, otherwise why it doesn't
}

// The device's protection, as reported by the running firmware. Informational only: modified
// firmware can report anything, so this cannot prove that the firmware is official.
message Security {
    optional bool secure_boot = 1;          // the chip only boots signed code
    optional string flash_encryption = 2;   // "off", "development" or "release"
    optional string key_storage = 3;        // where the root key lives: "development" (flash) or "efuse"
    optional bool signed_updates = 4;       // firmware updates must carry a valid signature
    // SHA-256 of the public key that signed the running firmware; absent if it is unsigned.
    // With secure_boot, the signature was checked at boot.
    optional bytes signer = 5;
    optional bool jtag_disabled = 6;        // permanently
    optional string download_mode = 7;      // USB/UART flashing: "normal", "secure" or "disabled"
}

message Logs {
    // Position of data's first byte. Greater than GetLogs.since when older output was overwritten.
    uint32 start = 1;
    bytes data = 2;         // UTF-8 log text, may end inside a line
    uint32 next = 3;        // position after data: the `since` for the following request
    uint32 end = 4;         // position after the newest byte logged so far
}

enum Profile {
    PROFILE_MAIN = 0;
    PROFILE_PHANTOM = 1;
}

enum PhantomState {
    PHANTOM_UNKNOWN = 0;    // never read a missing value as PHANTOM_NEW
    PHANTOM_NEW = 1;        // not set up: the next ProfileSecret sets it up
    PHANTOM_WAITING = 2;    // set up, waiting for its secret
    PHANTOM_OPEN = 3;
}

// Replies to GetProfiles and SelectProfile, and is also sent whenever any of it changes.
message Profiles {
    Profile active = 1;
    Profile default_profile = 2;        // active after power-up
    PhantomState phantom_state = 3;
    // Random, made when the phantom profile is set up and replaced when it is reset; present
    // while it is set up. Not secret: it tells the phone which of its secrets belongs here.
    bytes phantom_id = 4;
}
